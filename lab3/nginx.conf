events { worker_connections 1024; }

http {
    upstream flask_h2c {
        server defense-backend:5000;
        keepalive 32;
    }

    map $server_protocol $not_h2 {
        default     1;
        "HTTP/2.0"  0;
    }

    # Block 1: GIỐNG attack — vẫn có error_page redirect
    server {
        listen 9003 ssl http2;
        server_name localhost;

        if ($not_h2) {
            return 421;
        }

        ssl_certificate     /etc/nginx/server.crt;
        ssl_certificate_key /etc/nginx/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # GIỮ NGUYÊN — không xóa, không sửa
        error_page 401 http://example.org;

        location /admin { deny all; return 403; }
        location /error { return 401; }

        # Sử dụng grpc_pass để buộc HTTP/2 tới backend
        location / {
            grpc_pass grpc://flask_h2c;
            grpc_set_header Host $host;
        }
        location /count {
            grpc_pass grpc://flask_h2c;
            grpc_set_header Host $host;
        }
    }

    # Block 2: GIỐNG attack
    server {
        listen 9003 ssl http2;
        server_name internal;

        if ($not_h2) {
            return 421;
        }

        ssl_certificate     /etc/nginx/server.crt;
        ssl_certificate_key /etc/nginx/server.key;

        location / {
            grpc_pass grpc://flask_h2c;
            grpc_set_header Host $host;
        }
        location /admin {
            grpc_pass grpc://flask_h2c;
            grpc_set_header Host $host;
        }
        location /count {
            grpc_pass grpc://flask_h2c;
            grpc_set_header Host $host;
        }
        location /error {
            grpc_pass grpc://flask_h2c;
            grpc_set_header Host $host;
        }
    }
}