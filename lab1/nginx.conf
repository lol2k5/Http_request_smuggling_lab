events {
    worker_connections 1024;
}

http {
    server {
        listen 9001;
        server_name localhost;

        error_page 401 http://example.org;

        location / {
            proxy_pass http://flask-backend:5000;
            proxy_set_header Host $host;
        }

        location /admin {
            deny all;
            return 403;
        }

        location /count {
            proxy_pass http://flask-backend:5000;
            proxy_set_header Host $host;
        }
        
        location /error {
            return 401;
        }
    }

    server {
        listen 9001;
        server_name internal;

        location / {
            proxy_pass http://flask-backend:5000;
            proxy_set_header Host $host;
        }

        location /admin {
            proxy_pass http://flask-backend:5000;
            proxy_set_header Host $host;
        }

        location /count {
            proxy_pass http://flask-backend:5000;
            proxy_set_header Host $host;
        }

        location /error {
            proxy_pass http://flask-backend:5000;
            proxy_set_header Host $host;
        }
    }
}